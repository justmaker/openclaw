name: Android Release

on:
  push:
    tags:
      - 'androidclaw-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="$HOME/.android-sdk"
          CMDLINE_TOOLS_VERSION="12266719"
          ARCHIVE="commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          URL="https://dl.google.com/android/repository/${ARCHIVE}"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "$URL" -o "/tmp/${ARCHIVE}"
          unzip -q "/tmp/${ARCHIVE}" -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build Play Debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assemblePlayDebug

      - name: Build ThirdParty Debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleThirdPartyDebug

      - name: Rename APKs
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#androidclaw-}"

          PLAY_APK=$(find apps/android/app/build/outputs/apk/play/debug -name '*.apk' | head -1)
          THIRDPARTY_APK=$(find apps/android/app/build/outputs/apk/thirdParty/debug -name '*.apk' | head -1)

          mkdir -p release-artifacts

          if [ -n "$PLAY_APK" ]; then
            cp "$PLAY_APK" "release-artifacts/openclaw-${VERSION}-play-debug.apk"
          fi
          if [ -n "$THIRDPARTY_APK" ]; then
            cp "$THIRDPARTY_APK" "release-artifacts/openclaw-${VERSION}-thirdparty-debug.apk"
          fi

          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          body: |
            ## AndroidClaw ${{ github.ref_name }}

            ### Install
            1. Download the APK for your use case:
               - **play**: Standard build (no SMS/Call Log permissions)
               - **thirdparty**: Full permissions (sideload only)
            2. Enable "Install from unknown sources" on your device
            3. Install the APK

            ### First Launch
            1. Choose **Standalone Agent** or **Connect to Gateway**
            2. For Standalone: enter an API key or connect GitHub Copilot
            3. Start chatting

            ⚠️ Debug build — not signed for production use.
